[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autofixer-agent"
version = "0.1.0"
description = "FastMCP-powered RAG ingestion server for maintenance workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=0.2.0",
  "chromadb>=0.5.5",
  "openpyxl>=3.1.2",
  "pandas>=2.2.2",
  "python-docx>=1.1.2",
  "pypdf>=4.3.1",
  "beautifulsoup4>=4.12.3",
  "gitpython>=3.1.43",
  "python-gitlab>=4.8.0",
  "pyyaml>=6.0.2"
]

[project.scripts]
autofixer-mcp = "autofixer_agent.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
